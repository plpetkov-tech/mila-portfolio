backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: '[skip ci] Upload "{{path}}"'
    deleteMedia: '[skip ci] Delete "{{path}}"'

local_backend: true
media_folder: public/img
public_folder: /img
publish_mode: editorial_workflow # For Drafts

collections:
  - name: "arts"
    label: "Arts"
    folder: "content/arts"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
      - label: "Featured Image"
        name: "featuredimage"
        widget: "image"
        choose_url: false
      - label: "Categories"
        name: "categories"
        widget: "list"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Body"
        name: "body"
        widget: "markdown"

  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
      - label: "Featured Image"
        name: "featuredimage"
        widget: "image"
        choose_url: false
      - label: "Categories"
        name: "categories"
        widget: "list"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Body"
        name: "body"
        widget: "markdown"