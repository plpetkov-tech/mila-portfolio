[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/arts/"
  to = "/projects/"
  status = 301

# Print & Outdoor now lives inside the combined campaigns folder
[[redirects]]
  from = "/arts/print-outdoor-campaigns/"
  to = "/arts/seasonal-sales-promotions/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOW-FROM https://builtatlightspeed.com, https://jamstackthemes.dev"
